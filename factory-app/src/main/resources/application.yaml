spring:
  application:
    name: ai-factory
  lifecycle:
    # OPS-2: grace-period budget for each SmartLifecycle shutdown phase — chiefly the
    # web server draining in-flight HTTP (HITL console, REST, webhooks) before exit.
    # Bounded well under the 1800s engine lease so a rollout never hangs.
    timeout-per-shutdown-phase: ${FACTORY_SHUTDOWN_PHASE_TIMEOUT:60s}
  datasource:
    url: ${FACTORY_DB_URL:jdbc:postgresql://localhost:5432/factory}
    username: ${FACTORY_DB_USER:factory}
    password: ${FACTORY_DB_PASSWORD:factory}
    hikari:
      # PERF-1: sized to concurrency, not request volume — the LLM/Karate work runs
      # outside any transaction, so connections are borrowed only for sub-second
      # bursts. maximum-pool-size = worker-threads(4) + scheduler(2) + web headroom(8)
      # + flyway/misc(2) = 16. Raise FACTORY_DB_POOL_MAX in lockstep with worker-threads.
      # See doc/performance.md for the full rationale and load-test plan.
      maximum-pool-size: ${FACTORY_DB_POOL_MAX:16}
      minimum-idle: ${FACTORY_DB_POOL_MIN_IDLE:4}
      connection-timeout: ${FACTORY_DB_POOL_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${FACTORY_DB_POOL_MAX_LIFETIME_MS:1800000}
      idle-timeout: ${FACTORY_DB_POOL_IDLE_TIMEOUT_MS:600000}
      # No legitimate borrow lasts near a minute; a hit means a genuinely leaked connection.
      leak-detection-threshold: ${FACTORY_DB_POOL_LEAK_DETECTION_MS:60000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # REL-1: outbound HTTP client timeouts for the auto-configured RestClient.Builder
  # the Jira/GitHub/TestRail connectors clone (Spring Boot 4 plural `clients`
  # namespace). Both LLM clients use their own OkHttp transport and are unaffected;
  # they are bounded by factory.llm.read-timeout below.
  # Values are Durations; env overrides must also be Durations (e.g. 10s, 500ms).
  http:
    clients:
      connect-timeout: ${FACTORY_HTTP_CONNECT_TIMEOUT:5s}
      read-timeout: ${FACTORY_HTTP_READ_TIMEOUT:30s}
  ai:
    model:
      chat: ${FACTORY_LLM_PROVIDER:anthropic}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # REL-2: the SDK rebuilds its OkHttp client per request from this one Duration
      # (read + write + call timeouts), overriding anything an
      # AnthropicHttpClientBuilderCustomizer sets — so this is the only lever that
      # bounds a hung completion. Left unset the SDK default is 60s, which would kill
      # a legitimately long completion.
      timeout: ${factory.llm.read-timeout}
      chat:
        options:
          model: ${FACTORY_LLM_MODEL:claude-sonnet-4-5}
          max-tokens: 8192
    # Any OpenAI-compatible endpoint (Groq, Gemini, OpenRouter, local Ollama).
    # Active only when FACTORY_LLM_PROVIDER=openai.
    openai:
      api-key: ${FACTORY_LLM_API_KEY:unused}
      base-url: ${FACTORY_LLM_BASE_URL:https://api.groq.com/openai/v1}
      timeout: ${factory.llm.read-timeout}
      chat:
        completions-path: ${FACTORY_LLM_COMPLETIONS_PATH:/chat/completions}
        options:
          model: ${FACTORY_LLM_MODEL:llama-3.3-70b-versatile}
          max-tokens: 8192

server:
  # OPS-2: finish in-flight HTTP requests before exit instead of dropping them on
  # SIGTERM. Runs in the SmartLifecycle stop phase, bounded by timeout-per-shutdown-phase.
  shutdown: graceful

factory:
  auth:
    # SEC-1: console + REST API authentication. On by default; the HITL reviewer
    # identity is taken from the authenticated principal, never from the request.
    # Set false only where an authenticating proxy already fronts the app — the
    # audit ledger then records reviewers as unverified.
    enabled: ${FACTORY_AUTH_ENABLED:true}
    # Comma-separated user:password pairs, e.g. "qa-lead:<password>,rel-mgr:<password>".
    # ',' is the entry separator, so a plain password MUST NOT contain one — it would
    # be truncated and its tail turned into a second account. For such a password pass
    # a pre-encoded "{bcrypt}$2a$..." value instead (bcrypt output has no commas).
    # Usernames are limited to [A-Za-z0-9._@+-] and the resolved set is logged (names
    # only) at startup, so an account nobody declared is visible in the first screen of
    # log. When empty a random password is generated for user 'admin' and logged.
    users: ${FACTORY_AUTH_USERS:}
    # Let unauthenticated scrapers read /actuator/prometheus and /actuator/metrics.
    # Health probes are always public; everything else always requires auth.
    metrics-public: ${FACTORY_AUTH_METRICS_PUBLIC:false}
  webhooks:
    # Shared secret accepted in the X-Factory-Webhook-Token header (or the legacy
    # ?token= query parameter, which leaks into access logs). Unauthenticated while unset.
    shared-secret: ${FACTORY_WEBHOOKS_SHARED_SECRET:}
    # GitHub's own HMAC webhook secret. When set, /api/webhooks/github additionally
    # requires a valid X-Hub-Signature-256 over the raw body.
    github-secret: ${FACTORY_WEBHOOKS_GITHUB_SECRET:}
  llm:
    # REL-2: bounds one model call, wired into spring.ai.<provider>.timeout above.
    # Without it a hung completion holds an engine worker thread and its step lease.
    # Must exceed the slowest legitimate completion; raise it before raising
    # max-step-heartbeat-seconds. There is deliberately no connect-timeout: Spring AI
    # 2.0's SDK transports rebuild their OkHttp client per request from this single
    # Duration and leave the connect leg at the SDK's own 1-minute default, so a
    # connect property here could not reach the socket.
    read-timeout: ${FACTORY_LLM_READ_TIMEOUT:120s}
  dashboard:
    # PERF-2: the dashboard aggregates scan pipeline_execution and the append-only
    # audit_event table. Serve a snapshot rather than re-running them per request;
    # 0 disables caching (used by the aggregation tests).
    stats-cache-ttl: ${FACTORY_DASHBOARD_STATS_CACHE_TTL:30s}
  engine:
    poll-interval-ms: ${FACTORY_ENGINE_POLL_INTERVAL_MS:2000}
    batch-size: ${FACTORY_ENGINE_BATCH_SIZE:5}
    worker-threads: ${FACTORY_ENGINE_WORKER_THREADS:4}
    # Must exceed the longest legitimate single step (Karate runs are capped at 15
    # min) or the reaper re-queues live executions. Raise if your steps run longer.
    lease-timeout-seconds: ${FACTORY_ENGINE_LEASE_TIMEOUT_SECONDS:1800}
    # REL-2: while a step runs, the engine refreshes its lease on this cadence so a
    # legitimately slow step is not reaped and driven a second time concurrently.
    heartbeat-interval-seconds: ${FACTORY_ENGINE_HEARTBEAT_INTERVAL_SECONDS:60}
    # Upper bound on that defence. Past it the engine stops refreshing the lease and
    # lets the reaper recover the execution — otherwise a step wedged on a hung socket
    # would hold its worker thread and its lease forever. Must exceed the slowest
    # legitimate step (LLM read-timeout, the 15-min Karate cap).
    max-step-heartbeat-seconds: ${FACTORY_ENGINE_MAX_STEP_HEARTBEAT_SECONDS:3600}
    # Cadence of the lease reaper + sub-flow reconciliation sweep. Read by the
    # @Scheduled placeholder in ExecutionPoller, not by EngineProperties.
    reap-interval-ms: ${FACTORY_ENGINE_REAP_INTERVAL_MS:30000}
    # OPS-2: max seconds shutdown blocks draining in-flight engine steps before the
    # JVM exits; a longer step is abandoned and re-queued by the reaper after
    # lease-timeout-seconds. Keep <= the container termination grace period.
    shutdown-await-seconds: ${FACTORY_ENGINE_SHUTDOWN_AWAIT_SECONDS:30}
    # Requeue RUNNING rows orphaned by a prior crash on startup, so a restart does not
    # strand work (or tie up concurrency-cap slots) until the lease reaper clears them.
    # SINGLE-INSTANCE ONLY: set false for multi-instance so a restart never requeues a
    # peer instance's live work.
    reclaim-running-on-startup: ${FACTORY_ENGINE_RECLAIM_RUNNING_ON_STARTUP:true}
  limits:
    # COST-1: 0 disables the guard.
    max-concurrent-executions: ${FACTORY_LIMITS_MAX_CONCURRENT_EXECUTIONS:8}
    max-executions-per-day: ${FACTORY_LIMITS_MAX_EXECUTIONS_PER_DAY:200}
    # DATA-1: write-time size caps (bytes). Non-destructive; generous defaults.
    max-artifact-bytes: ${FACTORY_LIMITS_MAX_ARTIFACT_BYTES:5000000}
    max-trigger-payload-bytes: ${FACTORY_LIMITS_MAX_TRIGGER_PAYLOAD_BYTES:262144}
    dedup:
      enabled: ${FACTORY_LIMITS_DEDUP_ENABLED:true}
      # Re-fires of the same payload within this window collapse onto the first run.
      window: ${FACTORY_LIMITS_DEDUP_WINDOW:10m}
      # JSON pointers tried in order for a stable id; falls back to a sha256 of the
      # payload. Comma-separated. Explicit placeholder so the underscored env var binds.
      id-pointers: ${FACTORY_LIMITS_DEDUP_ID_POINTERS:/issueKey}
  retention:
    # DATA-1: destructive, so opt-in. Purges terminal execution trees older than the
    # TTL (COMPLETED/REJECTED/CANCELLED and descendants); audit_event is never purged.
    enabled: ${FACTORY_RETENTION_ENABLED:false}
    ttl-days: ${FACTORY_RETENTION_TTL_DAYS:90}
    batch-size: ${FACTORY_RETENTION_BATCH_SIZE:100}
    # Six-field Spring cron; set to "-" to disable the trigger even when enabled.
    run-cron: "${FACTORY_RETENTION_RUN_CRON:0 30 3 * * *}"
  connectors:
    jira:
      base-url: ${FACTORY_CONNECTORS_JIRA_BASE_URL:}
      email: ${FACTORY_CONNECTORS_JIRA_EMAIL:}
      api-token: ${FACTORY_CONNECTORS_JIRA_API_TOKEN:}
    github:
      base-url: ${FACTORY_CONNECTORS_GITHUB_BASE_URL:}
      token: ${FACTORY_CONNECTORS_GITHUB_TOKEN:}
    testrail:
      base-url: ${FACTORY_CONNECTORS_TESTRAIL_BASE_URL:}
      username: ${FACTORY_CONNECTORS_TESTRAIL_USERNAME:}
      api-key: ${FACTORY_CONNECTORS_TESTRAIL_API_KEY:}
      project-id: ${FACTORY_CONNECTORS_TESTRAIL_PROJECT_ID:0}
  test-factory:
    execution:
      base-url: ${FACTORY_TEST_FACTORY_EXECUTION_BASE_URL:}
      karate-jar: ${FACTORY_TEST_FACTORY_EXECUTION_KARATE_JAR:}
    target-repo: ${FACTORY_TEST_FACTORY_TARGET_REPO:}
    base-branch: ${FACTORY_TEST_FACTORY_BASE_BRANCH:main}
    jira-transition: ${FACTORY_TEST_FACTORY_JIRA_TRANSITION:}
    # Explicit placeholders: relaxed binding would NOT map the underscored env
    # vars onto these kebab-case properties by itself.
    testrail-section-id: ${FACTORY_TEST_FACTORY_TESTRAIL_SECTION_ID:}

logging:
  # OBS-1: JSON logging is opt-in via env so local `mvn spring-boot:run` stays
  # human-readable. Set FACTORY_LOG_FORMAT=ecs (or logstash / gelf) in containers.
  # An empty value keeps the standard pattern; under ecs/logstash every MDC entry
  # (executionId, stepId) is auto-included in the JSON.
  structured:
    format:
      console: ${FACTORY_LOG_FORMAT:}
    ecs:
      service:
        name: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        # OBS-1: prometheus scrape at /actuator/prometheus, metrics browse at /actuator/metrics.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # OBS-1: registers /actuator/health/liveness and /actuator/health/readiness probes.
      probes:
        enabled: true
      # SEC-1: /actuator/health stays public so probes need no credentials, so the db
      # and connector detail is shown only to an authenticated caller. The aggregate
      # status (and therefore both probes) is unaffected; with factory.auth.enabled=false
      # nobody is authenticated, so details are hidden there too — use /status.
      show-details: when-authorized
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
